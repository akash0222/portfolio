<text x="367" y="76" font-family="Arial,sans-serif" font-size="12" fill="#788aa6">Students</text><text x="432" y="76" font-family="Arial,sans-serif" font-size="12" fill="#788aa6">Marks</text><text x="482" y="76" font-family="Arial,sans-serif" font-size="12" fill="#788aa6">Results</text>
