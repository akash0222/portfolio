</g>
<g font-family="Arial,sans-serif"><text x="94" y="267" font-size="10" fill="#9fb0c9">Student records</text><text x="94" y="307" font-size="27" font-weight="700" fill="#f6f7ff">Ready</text><text x="94" y="327" font-size="9" fill="#83e1bf">Input validation</text>
<text x="301" y="267" font-size="10" fill="#9fb0c9">Marks</text><text x="301" y="307" font-size="27" font-weight="700" fill="#f6f7ff">Reviewed</text><text x="301" y="327" font-size="9" fill="#83e1bf">Data checks</text>
<text x="508" y="267" font-size="10" fill="#9fb0c9">SGPA / CGPA</text><text x="508" y="307" font-size="27" font-weight="700" fill="#f6f7ff">Computed</text><text x="508" y="327" font-size="9" fill="#83e1bf">Grade calculations</text>
