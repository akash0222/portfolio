<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">Result Generator preview</title>
<desc id="desc">An academic results dashboard showing semester grade summaries, a student result table, and publishing review states.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15334b"/><stop offset=".5" stop-color="#111f35"/><stop offset="1" stop-color="#11172a"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182b43"/><stop offset="1" stop-color="#132137"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#83e1bf"/><stop offset="1" stop-color="#67a9e8"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#9bbce1" stroke-opacity=".06"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020611" flood-opacity=".35"/></filter>
</defs>
<rect width="960" height="700" fill="url(#bg)"/><rect width="960" height="700" fill="url(#grid)"/><circle cx="855" cy="30" r="185" fill="#63b7db" opacity=".06"/>
<rect x="44" y="36" width="872" height="628" rx="20" fill="#101a2c" stroke="#9eb8db" stroke-opacity=".3" filter="url(#shadow)"/>
