<circle cx="106" cy="535" r="12" fill="#7f74bb" fill-opacity=".4"/><text x="106" y="539" text-anchor="middle" font-size="9" fill="#ded9ff">B</text><text x="128" y="532" font-size="11" font-weight="700" fill="#e5edfa">Student B</text><text x="128" y="546" font-size="8" fill="#8197b5">Sample record</text><text x="397" y="537" font-size="10" fill="#b3c3dc">BBA (COM)</text><text x="559" y="537" font-size="11" font-weight="700" fill="#f5f7ff">—</text><rect x="659" y="525" width="70" height="19" rx="9" fill="#1d4b40"/><text x="694" y="538" text-anchor="middle" font-size="9" fill="#a8f0d4">Checked</text><text x="789" y="537" font-size="10" fill="#83e1bf">Review ↗</text>
</g>
<rect x="76" y="603" width="808" height="34" rx="8" fill="#14263b" stroke="#8ea9cd" stroke-opacity=".22"/><circle cx="94" cy="620" r="4" fill="#83e1bf"/><text x="107" y="624" font-family="Arial,sans-serif" font-size="10" fill="#9eb1cd">Sample interface only</text><text x="862" y="624" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#83e1bf">Review before publishing ↗</text>
</svg>