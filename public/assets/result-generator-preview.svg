<text x="76" y="145" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#83e1bf">SEMESTER RESULTS</text>
<text x="76" y="184" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f5f7ff">Results overview</text>
<text x="76" y="209" font-family="Arial,sans-serif" font-size="12" fill="#9fb0c9">BBA · Semester 1 · Preview data</text>
<rect x="747" y="151" width="137" height="37" rx="8" fill="#18352f" stroke="#5cbaa0" stroke-opacity=".5"/><circle cx="764" cy="169" r="4" fill="#83e1bf"/><text x="776" y="173" font-family="Arial,sans-serif" font-size="10" fill="#b7f2df">Sample data</text>
