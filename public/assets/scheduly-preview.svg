<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">Scheduly timetable preview</title>
<desc id="desc">A dark academic scheduling workspace with weekday periods, color-coded classes, and conflict status.</desc>
<defs>
