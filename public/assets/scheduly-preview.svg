  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9a8ff"/><stop offset="1" stop-color="#80e7c1"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151d34"/><stop offset="1" stop-color="#10172a"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#b4a9ff" opacity=".18"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020611" flood-opacity=".35"/></filter>
</defs>
